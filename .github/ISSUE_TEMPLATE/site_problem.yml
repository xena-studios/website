name: Site problem
description: Something on xenastudios.co is broken, wrong or hard to use.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. This repository is the website only: problems with Raptor, NeoSkript, MostWanted or the plugins go to their own repositories (the links are on the previous page). For a security problem, don't use this form: see the [security policy](https://github.com/xena-studios/.github/blob/main/SECURITY.md).
  - type: input
    id: page
    attributes:
      label: Page
      description: The page's address, with the section if it's on the home page.
      placeholder: https://xenastudios.co/#plugins
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem
      options:
        - Something doesn't display or work right
        - Something is wrong or out of date
        - A broken link
        - Hard to use with a keyboard, screen reader or zoom
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong
      description: What you saw, and what you expected. A screenshot helps for anything visual.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: For display problems.
      placeholder: Safari on iPhone 15, iOS 26
