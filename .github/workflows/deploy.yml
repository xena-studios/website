name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Redeploy main by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-26.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Main deploys (on push or by hand); pull requests only check the build.
      - name: Deploy to Cloudflare
        # Skipped until the repo has Cloudflare secrets, and on forks.
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
