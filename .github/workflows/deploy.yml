name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Redeploy main by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time, so two quick merges can't deploy out of order.
# A newer push to a pull request replaces its older build.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-26.04
    env:
      # Only whether the token is set. The secrets themselves go to the deploy
      # step alone, never to npm ci (dependencies' install scripts) or the build.
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Main deploys (on push or by hand); pull requests only check the build.
      - name: Deploy to Cloudflare
        # Skipped until the repo has Cloudflare secrets, and on forks.
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_CLOUDFLARE_TOKEN == 'true' }}
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
