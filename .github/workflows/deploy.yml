name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Redeploy main by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time, so two quick merges can't deploy out of order.
# A newer push to a pull request replaces its older build.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every pull request and every push: the check main requires.
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  # Main only (on push or by hand), once the build passes. The Cloudflare token
  # lives in the production environment, which GitHub opens to main alone, and
  # only the deploy step sees it: never npm ci or the build.
  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'xena-studios/website' }}
    runs-on: ubuntu-26.04
    environment:
      name: production
      url: https://xenastudios.co
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not sensitive (it's in every dashboard URL), so a variable, not a secret.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
