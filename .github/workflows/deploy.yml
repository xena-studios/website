name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Redeploy main by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time, so two quick merges can't deploy out of order.
# A newer push to a pull request replaces its older build.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every pull request and every push: the check main requires.
  build:
    runs-on: ubuntu-26.04
    # A build takes about a minute; a hung one shouldn't hold the queue for six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Main only (on push or by hand), once the build passes. The Cloudflare token
  # lives in the production environment, which GitHub opens to main alone, and
  # only the deploy step sees it: never pnpm install or the build.
  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'xena-studios/website' }}
    runs-on: ubuntu-26.04
    # A stuck deploy would block every later one in the concurrency group.
    timeout-minutes: 10
    environment:
      name: production
      url: https://xenastudios.co
    steps:
      - uses: actions/checkout@v7
      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not sensitive (it's in every dashboard URL), so a variable, not a secret.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
