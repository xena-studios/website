name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Main deploys to production; pull requests get a preview URL.
      - name: Deploy to Cloudflare Pages
        # Skipped (build still checked) until the repo has Cloudflare secrets, and on forks.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: npx wrangler pages deploy dist --project-name xenastudios --branch "$BRANCH"
