name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pushes to main deploy; pull requests only check the build.
      - name: Deploy to Cloudflare
        # Skipped until the repo has Cloudflare secrets, and on forks.
        if: ${{ github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
